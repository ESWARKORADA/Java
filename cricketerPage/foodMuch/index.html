<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <header>
            <h1>User Management Dashboard</h1>
            <button id="add-user-btn">Add User</button>
        </header>
        <main>
            <table id="user-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>First Name</th>
                        <th>Last Name</th>
                        <th>Email</th>
                        <th>Department</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </main>
        <div id="user-form-modal" class="hidden">
            <form id="user-form">
                <input type="hidden" id="user-id">
                <label>First Name: <input type="text" id="first-name" required></label>
                <label>Last Name: <input type="text" id="last-name" required></label>
                <label>Email: <input type="email" id="email" required></label>
                <label>Department: <input type="text" id="department" required></label>
                <div>
                    <button type="submit">Save</button>
                    <button type="button" id="cancel-btn">Cancel</button>
                </div>
            </form>
        </div>
    </div>
    <script src="script.js"></script>
</body>
<script>
  const apiUrl = 'https://jsonplaceholder.typicode.com/users';
const userTable = document.querySelector('#user-table tbody');
const userFormModal = document.getElementById('user-form-modal');
const userForm = document.getElementById('user-form');
const addUserBtn = document.getElementById('add-user-btn');
const cancelBtn = document.getElementById('cancel-btn');

let editingUserId = null;

// Fetch users and display them
const fetchUsers = async () => {
    try {
        const response = await fetch(apiUrl);
        const users = await response.json();
        renderUsers(users);
    } catch (error) {
        console.error('Error fetching users:', error);
        alert('Failed to load users. Please try again later.');
    }
};

// Render users in the table
const renderUsers = (users) => {
    userTable.innerHTML = '';
    users.forEach((user) => {
        const row = document.createElement('tr');
        row.innerHTML = `
            <td>${user.id}</td>
            <td>${user.name.split(' ')[0]}</td>
            <td>${user.name.split(' ')[1] || ''}</td>
            <td>${user.email}</td>
            <td>${user.company.name}</td>
            <td>
                <button class="edit-btn" data-id="${user.id}">Edit</button>
                <button class="delete-btn" data-id="${user.id}">Delete</button>
            </td>
        `;
        userTable.appendChild(row);
    });
};


addUserBtn.addEventListener('click', () => {
    editingUserId = null;
    userForm.reset();
    userFormModal.classList.remove('hidden');
});

userForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const user = {
        name: `${document.getElementById('first-name').value} ${document.getElementById('last-name').value}`,
        email: document.getElementById('email').value,
        company: { name: document.getElementById('department').value },
    };

    try {
        const method = editingUserId ? 'PUT' : 'POST';
        const url = editingUserId ? `${apiUrl}/${editingUserId}` : apiUrl;
        const response = await fetch(url, {
            method,
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(user),
        });
        const newUser = await response.json();

        if (!editingUserId) {
            renderUsers([...Array.from(userTable.querySelectorAll('tr')).map(row => row.dataset), newUser]);
        }
        userFormModal.classList.add('hidden');
        fetchUsers();
    } catch (error) {
        console.error('Error saving user:', error);
        alert('Failed to save user. Please try again later.');
    }
});


userTable.addEventListener('click', async (e) => {
    if (e.target.classList.contains('edit-btn')) {
        const userId = e.target.dataset.id;
        editingUserId = userId;

        try {
            const response = await fetch(`${apiUrl}/${userId}`);
            const user = await response.json();

            const [firstName, lastName] = user.name.split(' ');
            document.getElementById('first-name').value = firstName || '';
            document.getElementById('last-name').value = lastName || '';
            document.getElementById('email').value = user.email;
            document.getElementById('department').value = user.company.name;

            userFormModal.classList.remove('hidden');
        } catch (error) {
            console.error('Error fetching user:', error);
            alert('Failed to load user details.');
        }
    } else if (e.target.classList.contains('delete-btn')) {
        const userId = e.target.dataset.id;

        if (confirm('Are you sure you want to delete this user?')) {
            try {
                await fetch(`${apiUrl}/${userId}`, { method: 'DELETE' });
                fetchUsers();
            } catch (error) {
                console.error('Error deleting user:', error);
                alert('Failed to delete user. Please try again later.');
            }
        }
    }
});



</script>
</html>
